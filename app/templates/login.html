{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body">
<h4>Sign in</h4><form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
<button class="btn btn-primary w-100">Sign in</button></form><p class="mt-3 mb-0 small">No account? <a href="/register">Register</a></p></div></div></div></div>{% endblock %}
