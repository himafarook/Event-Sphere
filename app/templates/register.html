{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body">
<h4>Create an attendee account</h4><form method="post" action="/register"><input type="hidden" name="csrf_token" value="{{ csrf }}">
<div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
<div class="mb-3"><label class="form-label">Password (min 8)</label><input class="form-control" type="password" name="password" minlength="8" required></div>
<button class="btn btn-primary w-100">Register</button></form></div></div></div></div>{% endblock %}
